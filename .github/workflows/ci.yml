name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_macos_client_app_e2e.py

  macos-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-build-macos.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-build-macos.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Build and test Apple Silicon app
        run: |
          test "$(uname -m)" = arm64
          XUANJIAN_NODE_BIN="$(command -v node)" python scripts/build_macos_client_app.py
          python -m pytest -q -p no:cacheprovider
      - name: Verify extracted candidate
        run: |
          ditto -c -k --keepParent "dist/玄鉴·书房.app" "$RUNNER_TEMP/xuanjian-candidate.zip"
          mkdir "$RUNNER_TEMP/extracted"
          ditto -x -k "$RUNNER_TEMP/xuanjian-candidate.zip" "$RUNNER_TEMP/extracted"
          codesign --verify --deep --strict "$RUNNER_TEMP/extracted/玄鉴·书房.app"
